<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Properties</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <h1>Display Properties </h1>
    <h3>Display : block</h3>
    <div class="box block">I am block (take full width)</div>
    <div class="box block">I am block too</div>

    <h3>Display : inline</h3>
    <div class="box inline">Inline 1</div>
    <div class="box inline">Inline 2</div>
    <div class="box inline">Inline 3</div>

    <h3>display : inline-box</h3>
    <div class="box inline-block">Inline-block 1</div>
    <div class="box inline-block">Inline-block 2</div>
    <div class="box inline-block">Inline-block 3</div>

    <h3>display : none (hidden)</h3>
    <div class="box none">you cannot see me (display: none)</div>
</body>
</html>
